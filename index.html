<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>WatchDog OS</title>
    <script>
      // 一次性数据迁移：classicy 会把应用名持久化到 localStorage（classicyDesktopState）。
      // 旧版本曾使用中文名「系统监控」「系统探针」与英文名「System Monitor」，
      // 在应用代码加载前先改写为当前产品名，避免菜单栏/窗口/Dock 图标等残留旧名。
      (function () {
        try {
          var KEY = 'classicyDesktopState';
          var raw = localStorage.getItem(KEY);
          var next = raw;
          if (next) {
            next = next.split('系统监控').join('WatchDog OS');
            next = next.split('系统探针').join('WatchDog OS');
            next = next.split('System Monitor').join('WatchDog OS');
            if (next !== raw) localStorage.setItem(KEY, next);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
